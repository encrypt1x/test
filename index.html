<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">

  <title>Frontend Mentor | Profile card component</title>

</head>

<body>
<section class="c-profile-card">

  <div class="c-profile-card__banner">
    <img src="/assets/images/bg-pattern-card.svg" alt="">
    <div class="c-profile-card__profile">
      <img src="assets/images/image-victor.jpg" alt="">
    </div>
  </div>
  
  <header class="c-profile-card__header">
    <h2 class="c-profile-card__name u-text-strong">Victor Crest</h2>
    <span class="c-profile-card__age">26</span>
    <p class="c-profile-card__location">London</p>
  </header>

  <hr>

  <ul class="c-profile-card__stats">
    <li class="c-profile-card__stat">
      <span class="c-profile-card__value u-text-strong">80K</span>
      <span class="c-profile-card__label">Followers</span>
    </li>

    <li class="c-profile-card__stat">
      <span class="c-profile-card__value u-text-strong">803K</span>
      <span class="c-profile-card__label">Likes</span>
    </li>

    <li class="c-profile-card__stat">
      <span class="c-profile-card__value u-text-strong">1.4K</span>
      <span class="c-profile-card__label">Photos</span>
    </li>
  </ul>

</section>

</body>

</html>
